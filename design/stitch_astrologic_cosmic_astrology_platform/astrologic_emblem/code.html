<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
	<defs>
		<linearGradient id="astroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#a78bfa" />
			<stop offset="50%" stop-color="#7c3aed" />
			<stop offset="100%" stop-color="#06b6d4" />
		</linearGradient>
		<filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="3" result="blur" />
			<feComposite in="SourceGraphic" in2="blur" operator="over" />
		</filter>
	</defs>
	<circle
		cx="50"
		cy="50"
		r="44"
		stroke="url(#astroGrad)"
		stroke-width="2"
		stroke-dasharray="4 3"
		opacity="0.6"
	/>
	<circle cx="50" cy="50" r="38" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
	<!-- Celestial Astrolabe / Star Symbol -->
	<path
		d="M50 14 L50 86 M14 50 L86 50"
		stroke="url(#astroGrad)"
		stroke-width="1.5"
		stroke-linecap="round"
		opacity="0.8"
	/>
	<path
		d="M25 25 L75 75 M25 75 L75 25"
		stroke="rgba(167, 139, 250, 0.4)"
		stroke-width="1"
		stroke-linecap="round"
	/>
	<!-- Central North Star Diamond -->
	<polygon
		points="50,28 54,46 72,50 54,54 50,72 46,54 28,50 46,46"
		fill="url(#astroGrad)"
		filter="url(#glow)"
	/>
	<circle cx="50" cy="50" r="4" fill="#ffffff" />
	<circle cx="50" cy="20" r="2.5" fill="#06b6d4" />
	<circle cx="80" cy="50" r="2.5" fill="#a78bfa" />
	<circle cx="50" cy="80" r="2.5" fill="#7c3aed" />
	<circle cx="20" cy="50" r="2.5" fill="#06b6d4" />
</svg>
